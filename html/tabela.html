<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tabela</title>
</head>
<body style=" color: blueviolet;">
    <h1 style="font: 100;">Tabela</h1>
    <p style="text-align:justify;color: black;">Forma de organizar as informações, dados em uma estrutura de colunas e linhas.</p>
    <TABLE style="width: 100%;border-collapse: collapse ;color: black;">
    <tr style="color: blueviolet;">
        <th style="border: 1px solid black;">Produto</th>
        <th style="border: 1px solid black;">Descrição</th>
        <th style="border: 1px solid black;">Preço</th>
    </tr>
    <tr>
        <td>luva</td>
        <td>latex</td>
        <td>R$10,00</td>
    </tr>
    <tr>
        <td>Farinha</td>
        <td>Fardo</td>
        <td>R$100,00</td>
    </tr>

    </TABLE>
</body>
</html>
